<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E8BFF"/>
      <stop offset="0.55" stop-color="#4F5BF0"/>
      <stop offset="1" stop-color="#6A3FD8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#E9EDFF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1466" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 圆角方形底（接近 Apple 的连续曲率圆角） -->
  <path d="M512 64c260 0 340 0 394 54s54 134 54 394 0 340-54 394-134 54-394 54-340 0-394-54S64 772 64 512s0-340 54-394S252 64 512 64z" fill="url(#bg)"/>
  <path d="M512 64c260 0 340 0 394 54s54 134 54 394 0 340-54 394-134 54-394 54-340 0-394-54S64 772 64 512s0-340 54-394S252 64 512 64z" fill="url(#shine)"/>
  <!-- 叠放的卡片：代表一组 skill -->
  <g filter="url(#drop)">
    <rect x="292" y="250" width="440" height="300" rx="56" fill="#fff" fill-opacity="0.28"/>
    <rect x="252" y="330" width="520" height="340" rx="64" fill="#fff" fill-opacity="0.5"/>
    <rect x="212" y="420" width="600" height="380" rx="72" fill="url(#card)"/>
  </g>
  <!-- 前卡片上的开关和星光 -->
  <rect x="286" y="660" width="168" height="84" rx="42" fill="#34C759"/>
  <circle cx="412" cy="702" r="32" fill="#fff"/>
  <path d="M630 470c10 62 34 86 96 96-62 10-86 34-96 96-10-62-34-86-96-96 62-10 86-34 96-96z" fill="#5B5CF0"/>
  <path d="M520 640c5 30 17 42 47 47-30 5-42 17-47 47-5-30-17-42-47-47 30-5 42-17 47-47z" fill="#8E7CFF"/>
